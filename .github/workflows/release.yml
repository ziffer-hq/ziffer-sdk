# Publishes the five npm packages from a pushed tag, with provenance, by npm
# trusted publishing (OpenID Connect). No npm token exists anywhere: npmjs.com
# trusts THIS workflow file, in THIS repository, in the environment npm-release,
# and nothing else.
#
# Nothing runs until the owner approves: the job's environment, npm-release, has
# the owner as its required reviewer.
#
# What it publishes must be byte-identical to what the private gate tested.
# release/expected-checksums.txt holds the release digest of each tarball that
# gate packed, and a tarball whose digest differs is refused BEFORE anything is
# published. The release digest is the sha256 of the tar INSIDE the gzip, as
# `node tools/pack-npm.mjs --digest` prints it: tools/pack-npm.mjs writes that
# tar in one canonical form on every machine, while the compressed bytes are
# zlib's and differ between zlib builds (that file's header says why and what
# was measured). --digest refuses a tarball not in that canonical form.
name: release

on:
  push:
    tags:
      - 'npm-v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Node 22.16.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: npm 11.20.0 (trusted publishing needs 11.5.1 or later)
        run: npm install --global npm@11.20.0 && npm --version

      - name: pnpm from packageManager
        run: corepack enable && pnpm --version

      - name: The tag names the version every package carries
        run: |
          want="${GITHUB_REF_NAME#npm-v}"
          for d in packages/types packages/acp-verify packages/acp-client packages/scan packages/mcp; do
            got="$(node -p "require('./$d/package.json').version")"
            if [ "$got" != "$want" ]; then
              echo "VersionMismatch: $d is at $got and the tag says $want" >&2
              exit 1
            fi
          done

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r --workspace-concurrency=1 test

      - name: Pack, in dependency order
        run: |
          mkdir -p "$RUNNER_TEMP/dist-npm"
          : > "$RUNNER_TEMP/packed.txt"
          for d in packages/types packages/acp-verify packages/acp-client packages/scan packages/mcp; do
            tgz="$(node tools/pack-npm.mjs "$d" "$RUNNER_TEMP/dist-npm" | tail -1)"
            key="$(node -p "const m = require('./$d/package.json'); m.name + '@' + m.version")"
            printf '%s %s\n' "$key" "$tgz" >> "$RUNNER_TEMP/packed.txt"
          done

      - name: Every tarball is the one the private gate tested
        run: |
          expected="$GITHUB_WORKSPACE/release/expected-checksums.txt"
          listed="$(grep -vc '^#' "$expected")"
          if [ "$listed" != 5 ]; then
            echo "ChecksumSetMismatch: $expected lists $listed packages, not 5" >&2
            exit 1
          fi
          while read -r key tgz; do
            want="$(awk -v k="$key" '$2 == k {print $1}' "$expected")"
            got="$(node tools/pack-npm.mjs --digest "$tgz")"
            if [ -z "$want" ]; then
              echo "ChecksumMissing: $expected has no line for $key. Nothing was published." >&2
              exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "ChecksumMismatch: $key packed to release digest $got; the private gate tested $want. Nothing was published." >&2
              exit 1
            fi
            echo "$key $got matches"
          done < "$RUNNER_TEMP/packed.txt"

      - name: Publish, in dependency order
        run: |
          while read -r key tgz; do
            npm publish "$tgz" --access public
          done < "$RUNNER_TEMP/packed.txt"
