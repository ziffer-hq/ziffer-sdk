GOOSE_PROVIDER: "anthropic"
GOOSE_MODEL: "claude-sonnet"

extensions:
  developer:
    type: builtin
    name: developer
    enabled: true
    bundled: true
    timeout: 300

  computercontroller:
    type: platform
    name: computercontroller
    display_name: Computer Controller
    enabled: true
    bundled: true

  filesystem:
    type: stdio
    name: filesystem
    enabled: true
    cmd: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    env_keys: []
    envs: {}
    timeout: 300

  remote-tools:
    type: streamable_http
    name: remote-tools
    enabled: true
    uri: "https://example.com/mcp"
    headers: {}
    env_keys: []
    envs: {}
    timeout: 300

  github:
    type: stdio
    name: GitHub
    enabled: false
    cmd: npx
    args:
      - -y
      - "@modelcontextprotocol/server-github"
    envs: { GITHUB_PERSONAL_ACCESS_TOKEN: fixture-value }
